[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/tmux" # ou o caminho correto retornado por 'which tmux'
#args = ["new-session", "-A", "-s", "main"] # Cria ou anexa à sessão 'main'


[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 16

[window]
#padding.x = 14
#padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
{ key = "Return", mods = "Shift", chars = "\u001B\r" }
]
